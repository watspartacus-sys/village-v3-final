name: Build V13.3 Add Members
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Create V13.3
        run: |
          rm -rf app build.gradle settings.gradle gradle.properties
          mkdir -p app/src/main/java/com/zeu/v3
          echo "android.useAndroidX=true" > gradle.properties
          echo "include ':app'" > settings.gradle
          cat > build.gradle <<'EOF'
          buildscript {
            repositories { google(); mavenCentral() }
            dependencies {
              classpath 'com.android.tools.build:gradle:8.2.2'
              classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22'
            }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF
          cat > app/build.gradle <<'EOF'
          apply plugin: 'com.android.application'
          apply plugin: 'org.jetbrains.kotlin.android'
          android {
            namespace 'com.zeu.v3'
            compileSdk 34
            defaultConfig {
              applicationId "com.zeu.v3"
              minSdk 24; targetSdk 34
              versionCode 16; versionName "13.3-add"
            }
            buildTypes { release { minifyEnabled false } }
            compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
            kotlinOptions { jvmTarget = '17' }
            buildFeatures { compose true }
            composeOptions { kotlinCompilerExtensionVersion '1.5.10' }
          }
          dependencies {
            implementation 'androidx.core:core-ktx:1.12.0'
            implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
            implementation 'androidx.activity:activity-compose:1.8.2'
            implementation platform('androidx.compose:compose-bom:2024.02.00')
            implementation 'androidx.compose.ui:ui'
            implementation 'androidx.compose.material3:material3'
            implementation 'androidx.compose.foundation:foundation'
          }
          EOF
          cat > app/src/main/java/com/zeu/v3/MainActivity.kt <<'EOF'
          package com.zeu.v3
          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.background
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import java.text.SimpleDateFormat
          import java.util.*
          data class Member(val id: Int, val name: String, val initials: String, var saved: Double, var status: String)
          data class Record(val date: String, val week: Int, val memberId: Int, val memberName: String, val amount: Double)
          class MainActivity : ComponentActivity() {
           override fun onCreate(savedInstanceState: Bundle?) { super.onCreate(savedInstanceState); setContent { ZeuApp() } }
          }
          @Composable
          fun ZeuApp(){
           var appPin by remember { mutableStateOf("") }
           var inputPin by remember { mutableStateOf("") }
           var isLocked by remember { mutableStateOf(true) }
           var isSetting by remember { mutableStateOf(true) }
           var error by remember { mutableStateOf("") }
           var amount by remember { mutableStateOf("1000") }
           var curDate by remember { mutableStateOf("22-08-2026") }
           var nextDate by remember { mutableStateOf("29-08-2026") }
           var weekNum by remember { mutableStateOf(1) }
           var box by remember { mutableStateOf(84500.0) }
           var records by remember { mutableStateOf(listOf<Record>()) }
           var members by remember { mutableStateOf(listOf(Member(1,"Amina K.","AK",1000.0,"Paid"), Member(2,"Joseph M.","JM",1000.0,"Paid"), Member(3,"Grace W.","GW",0.0,"Due"), Member(4,"Ben T.","BT",1000.0,"Paid"))) }
           var selectedMember by remember { mutableStateOf<Member?>(null) }
           var showAdd by remember { mutableStateOf(false) }
           var newName by remember { mutableStateOf("") }
           val Green = Color(0xFF2E7D32)
           fun getInitials(name: String): String { try{ val parts=name.trim().split(" ").filter{it.isNotEmpty()}; return if(parts.size>=2) "${parts[0][0]}${parts[1][0]}".uppercase() else if(parts.isNotEmpty()) parts[0].take(2).uppercase() else "?" } catch(e:Exception){ return "?" } }
           fun addDays(d: String, days: Int): String { return try { val sdf=SimpleDateFormat("dd-MM-yyyy", Locale.getDefault()); val c=Calendar.getInstance(); c.time=sdf.parse(d)!!; c.add(Calendar.DAY_OF_YEAR, days); sdf.format(c.time) } catch(e:Exception){ d } }
           if(isLocked){
             Box(Modifier.fillMaxSize().background(Green), contentAlignment=Alignment.Center){
               Card(Modifier.padding(20.dp).fillMaxWidth(), shape=RoundedCornerShape(24.dp)){
                 Column(Modifier.padding(24.dp), horizontalAlignment=Alignment.CenterHorizontally){
                   Text("🔒", fontSize=48.sp); Text(if(isSetting) "Set PIN" else "Enter PIN", fontWeight=FontWeight.Bold, fontSize=20.sp); Text("Week $weekNum: $curDate", fontSize=11.sp)
                   Spacer(Modifier.height(12.dp))
                   OutlinedTextField(value=inputPin, onValueChange={ if(it.length<=4) inputPin=it.filter{ch->ch.isDigit()} }, label={Text("4-digit PIN")}, modifier=Modifier.fillMaxWidth())
                   if(error!="") Text(error, color=Color.Red, fontSize=12.sp)
                   Spacer(Modifier.height(10.dp))
                   Button(onClick={ if(isSetting){ if(inputPin.length==4){ appPin=inputPin; isSetting=false; isLocked=false; inputPin="" } else error="4 digits" } else { if(inputPin==appPin){ isLocked=false; inputPin="" } else error="Wrong!" } }, modifier=Modifier.fillMaxWidth(), colors=ButtonDefaults.buttonColors(containerColor=Green)){ Text(if(isSetting) "Set & Open" else "Unlock") }
                 }
               }
             }
           } else {
             if(selectedMember!=null){
               val m = selectedMember!!
               val pers = records.filter{ it.memberId==m.id }
               val total = pers.sumOf{ it.amount } + m.saved
               AlertDialog(onDismissRequest={selectedMember=null}, title={Text("#${m.id} ${m.name}", fontWeight=FontWeight.Bold)}, text={
                 Column{ Text("Initials: ${m.initials} | Week $weekNum: $curDate", fontSize=12.sp); Card(colors=CardDefaults.cardColors(containerColor=Color(0xFFE8F5E9)), shape=RoundedCornerShape(8.dp)){ Column(Modifier.padding(10.dp)){ Text("Personal: ${total.toInt()} UGX", fontWeight=FontWeight.Bold); Text("Status: ${m.status}") } }; Spacer(Modifier.height(6.dp)); Text("Dates:", fontWeight=FontWeight.Bold); if(pers.isEmpty()) Text("📅 $curDate - ${m.saved.toInt()} UGX", fontSize=12.sp) else pers.forEach{ r-> Text("📅 ${r.date} W${r.week} ${r.amount.toInt()}", fontSize=12.sp) } }
               }, confirmButton={ Button(onClick={ selectedMember=null }, colors=ButtonDefaults.buttonColors(containerColor=Green)){ Text("Close") } })
             }
             if(showAdd){
               AlertDialog(onDismissRequest={showAdd=false}, title={Text("Add New Member", fontWeight=FontWeight.Bold)}, text={
                 Column{
                   Text("Week $weekNum: $curDate - New member joins next $nextDate", fontSize=11.sp, color=Color.Gray)
                   Spacer(Modifier.height(8.dp))
                   OutlinedTextField(value=newName, onValueChange={newName=it}, label={Text("Full Name e.g Sarah N.")}, modifier=Modifier.fillMaxWidth())
                   if(newName.isNotEmpty()){ Spacer(Modifier.height(6.dp)); Text("Initials: ${getInitials(newName)} | ID: #${members.size+1}", fontSize=12.sp, color=Green) }
                 }
               }, confirmButton={
                 Button(onClick={ if(newName.trim().length>=2){ val id=members.size+1; val ini=getInitials(newName); members=members+Member(id, newName.trim(), ini, 0.0, "Due"); newName=""; showAdd=false } }, colors=ButtonDefaults.buttonColors(containerColor=Green)){ Text("Add #${members.size+1}") }
               }, dismissButton={ OutlinedButton(onClick={ showAdd=false; newName="" }){ Text("Cancel") } })
             }
             Scaffold{ pad->
               Column(Modifier.padding(pad).background(Color(0xFFF5F5F5)).fillMaxSize()){
                 Card(Modifier.fillMaxWidth(), shape=RoundedCornerShape(bottomStart=20.dp, bottomEnd=20.dp), colors=CardDefaults.cardColors(containerColor=Green)){
                   Row(Modifier.padding(16.dp).fillMaxWidth(), horizontalArrangement=Arrangement.SpaceBetween, verticalAlignment=Alignment.CenterVertically){
                     Column{ Text("Zeu Savings", color=Color.White, fontWeight=FontWeight.Bold, fontSize=18.sp); Text("Week $weekNum: $curDate | Next: $nextDate | ${members.size} members", color=Color.White, fontSize=11.sp) }
                     Box(Modifier.size(36.dp).clip(CircleShape).background(Color.White).clickable{ isLocked=true }, contentAlignment=Alignment.Center){ Text("🔒") }
                   }
                 }
                 LazyColumn(Modifier.padding(12.dp)){
                   item{
                     Card(Modifier.fillMaxWidth(), shape=RoundedCornerShape(16.dp)){
                       Column(Modifier.padding(16.dp)){
                         Text("Flexible Savings Input", fontWeight=FontWeight.Bold, fontSize=18.sp)
                         Text("Week $weekNum: $curDate • Next: $nextDate (+7d)", fontSize=11.sp, color=Color.Gray)
                         OutlinedTextField(value=amount, onValueChange={amount=it}, label={Text("Amount VSH")}, modifier=Modifier.fillMaxWidth().padding(top=8.dp))
                         Row(Modifier.fillMaxWidth().padding(top=8.dp), horizontalArrangement=Arrangement.spacedBy(6.dp)){ listOf("500","1000","5000","10000").forEach{ v-> OutlinedButton(onClick={amount=v}, shape=RoundedCornerShape(20.dp)){ Text("+$v", fontSize=11.sp) } } }
                         Button(onClick={ val a=amount.toDoubleOrNull()?:0.0; if(a>0){ val target=selectedMember?:members.firstOrNull(); if(target!=null){ box+=a; records=records+Record(curDate, weekNum, target.id, target.name, a); members=members.map{ if(it.id==target.id) it.copy(saved=it.saved+a, status="Paid") else it } } } }, modifier=Modifier.fillMaxWidth().padding(top=8.dp), colors=ButtonDefaults.buttonColors(containerColor=Green)){ Text("Save Now - $curDate") }
                         Row(Modifier.padding(top=8.dp), horizontalArrangement=Arrangement.spacedBy(8.dp)){ Button(onClick={ curDate=nextDate; nextDate=addDays(curDate,7); weekNum++ }, colors=ButtonDefaults.buttonColors(containerColor=Color(0xFF1565C0))){ Text("CLOSE -> $nextDate", fontSize=11.sp) }; OutlinedButton(onClick={ isLocked=true }){ Text("Lock") } }
                         Text("Tap member to select for saving", fontSize=10.sp, color=Green, modifier=Modifier.padding(top=4.dp))
                       }
                     }
                     Spacer(Modifier.height(10.dp))
                   }
                   item{
                     Card(Modifier.fillMaxWidth(), shape=RoundedCornerShape(16.dp)){
                       Column(Modifier.padding(12.dp)){
                         Row(Modifier.fillMaxWidth(), horizontalArrangement=Arrangement.SpaceBetween, verticalAlignment=Alignment.CenterVertically){
                           Text("Members (${members.size}) 👆 Tap", fontWeight=FontWeight.Bold, color=Green)
                           Button(onClick={ showAdd=true }, colors=ButtonDefaults.buttonColors(containerColor=Green), contentPadding=PaddingValues(horizontal=12.dp, vertical=6.dp)){ Text("+ Add Member", fontSize=12.sp) }
                         }
                         Spacer(Modifier.height(6.dp))
                         members.forEach{ m->
                           Card(Modifier.fillMaxWidth().padding(vertical=4.dp).clickable{ selectedMember=m }, colors=CardDefaults.cardColors(containerColor=if(selectedMember?.id==m.id) Color(0xFFE8F5E9) else Color.White), elevation=CardDefaults.cardElevation(2.dp)){
                             Row(Modifier.padding(10.dp).fillMaxWidth(), verticalAlignment=Alignment.CenterVertically){
                               Box(Modifier.size(40.dp).clip(CircleShape).background(Color(0xFFFFE082)), contentAlignment=Alignment.Center){ Text(m.initials, fontWeight=FontWeight.Bold) }
                               Spacer(Modifier.width(10.dp))
                               Column(Modifier.weight(1f)){ Text("#${m.id} ${m.name}", fontWeight=FontWeight.Bold, fontSize=14.sp); Text("Saved ${m.saved.toInt()} • 📅 $curDate", fontSize=11.sp, color=Color.Gray) }
                               Column(horizontalAlignment=Alignment.End){ Text(m.status, color=if(m.status=="Paid") Green else Color.Red, fontSize=11.sp, fontWeight=FontWeight.Bold); if(selectedMember?.id==m.id) Text("✓ Selected", fontSize=9.sp, color=Green) else Text("Tap >", fontSize=10.sp, color=Color(0xFFED6C02)) }
                             }
                           }
                         }
                         if(members.size>=12) Text("Max 12 members - like Zeu screenshot!", fontSize=10.sp, color=Color.Gray, modifier=Modifier.padding(top=6.dp))
                       }
                     }
                     Spacer(Modifier.height(10.dp))
                   }
                   item{
                     Card(Modifier.fillMaxWidth(), colors=CardDefaults.cardColors(containerColor=Color(0xFFFFF8E1)), shape=RoundedCornerShape(16.dp)){
                       Column(Modifier.padding(16.dp), horizontalAlignment=Alignment.CenterHorizontally){
                         Text("Group Fund Total"); Text("VSH ${box.toInt()}", fontWeight=FontWeight.Bold, fontSize=22.sp); Text("${members.size} members • Week $weekNum: $curDate -> $nextDate", fontSize=11.sp, color=Green)
                       }
                     }
                   }
                 }
               }
             }
           }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
           <application android:label="Zeu V13.3 Add" android:theme="@android:style/Theme.Material.Light">
            <activity android:name=".MainActivity" android:exported="true">
             <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
            </activity>
           </application>
          </manifest>
          EOF
      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.5
      - name: Build APK
        run: |
          echo "android.useAndroidX=true" > gradle.properties
          echo "android.useAndroidX=true" > app/gradle.properties
          mkdir -p ~/.gradle
          echo "android.useAndroidX=true" > ~/.gradle/gradle.properties
          gradle :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Zeu-V13.3-Add-Members-APK
          path: app/build/outputs/apk/debug/app-debug.apk
