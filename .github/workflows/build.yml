name: Build V12 APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Create V12
        run: |
          rm -rf app build.gradle settings.gradle gradle.properties
          mkdir -p app/src/main/java/com/zeu/v3
          echo "android.useAndroidX=true" > gradle.properties
          echo "include ':app'" > settings.gradle
          cat > build.gradle <<'EOF'
          buildscript {
            repositories { google(); mavenCentral() }
            dependencies {
              classpath 'com.android.tools.build:gradle:8.2.2'
              classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22'
            }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF
          cat > app/build.gradle <<'EOF'
          apply plugin: 'com.android.application'
          apply plugin: 'org.jetbrains.kotlin.android'
          android {
            namespace 'com.zeu.v3'
            compileSdk 34
            defaultConfig {
              applicationId "com.zeu.v3"
              minSdk 24; targetSdk 34
              versionCode 12; versionName "12.0"
            }
            buildTypes { release { minifyEnabled false } }
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
            kotlinOptions { jvmTarget = '17' }
            buildFeatures { compose true }
            composeOptions { kotlinCompilerExtensionVersion '1.5.10' }
          }
          dependencies {
            implementation 'androidx.core:core-ktx:1.12.0'
            implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
            implementation 'androidx.activity:activity-compose:1.8.2'
            implementation platform('androidx.compose:compose-bom:2024.02.00')
            implementation 'androidx.compose.ui:ui'
            implementation 'androidx.compose.material3:material3'
          }
          EOF
          cat > app/src/main/java/com/zeu/v3/MainActivity.kt <<'EOF'
          package com.zeu.v3
          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.unit.dp
          import java.text.SimpleDateFormat
          import java.util.*
          data class Member(val id: Int, var name: String, var saved: Double=0.0, var fee: Double=0.0, var loan: Double=0.0)
          data class Record(val date: String, val week: Int, val memberId: Int, val member: String, val type: String, val amount: Double, val boxAfter: Double)
          class MainActivity : ComponentActivity() {
           override fun onCreate(savedInstanceState: Bundle?) { super.onCreate(savedInstanceState); setContent { VillageV12() } }
          }
          @OptIn(ExperimentalMaterial3Api::class)
          @Composable
          fun VillageV12(){
           val sdf = SimpleDateFormat("dd-MM-yyyy", Locale.getDefault())
           fun addDays(dateStr: String, days: Int): String {
             return try { val cal = Calendar.getInstance(); cal.time = sdf.parse(dateStr)!!; cal.add(Calendar.DAY_OF_YEAR, days); sdf.format(cal.time) } catch(e: Exception){ dateStr }
           }
           var nextId by remember { mutableStateOf(4) }
           var members by remember { mutableStateOf(listOf(Member(1,"James"), Member(2,"Mary"), Member(3,"Sarah"))) }
           var records by remember { mutableStateOf(listOf<Record>()) }
           var newName by remember { mutableStateOf("") }
           var feeAmount by remember { mutableStateOf("1000") }
           var isStarted by remember { mutableStateOf(false) }
           var isClosed by remember { mutableStateOf(false) }
           var tab by remember { mutableStateOf(0) }
           var showClearDialog by remember { mutableStateOf(false) }
           var selectedMember by remember { mutableStateOf<Member?>(null) }
           var weekNum by remember { mutableStateOf(1) }
           var currentDate by remember { mutableStateOf("22-08-2026") }
           var nextDate by remember { mutableStateOf("29-08-2026") }
           var box by remember { mutableStateOf(0.0) }
           var social by remember { mutableStateOf(0.0) }
           var totalSavedToday by remember { mutableStateOf(0.0) }
           val FIXED = 5000.0
           val LOAN_AMT = 150000.0
           val MIN_SAVING = 120000.0
           val RETURN_AMT = 165000.0
           val combinedSavings = members.sumOf{it.saved}
           val totalGroup = box + social
           if(showClearDialog){
             AlertDialog(onDismissRequest={showClearDialog=false}, title={Text("Clear ALL?")}, text={Text("Reset to 22-08-2026?")},
             confirmButton={Button(onClick={ members=emptyList(); records=emptyList(); box=0.0; social=0.0; totalSavedToday=0.0; isStarted=false; isClosed=false; nextId=1; weekNum=1; currentDate="22-08-2026"; nextDate="29-08-2026"; showClearDialog=false }){Text("YES")}},
             dismissButton={OutlinedButton(onClick={showClearDialog=false}){Text("Cancel")}})
           }
           selectedMember?.let{ mem ->
             val memRecords = records.filter{ it.memberId == mem.id }
             AlertDialog(onDismissRequest={selectedMember=null},
             title={Text("#${mem.id} ${mem.name}")},
             text={
               Column{
                 Card(Modifier.fillMaxWidth(), colors=CardDefaults.cardColors(containerColor=MaterialTheme.colorScheme.primaryContainer)){ Column(Modifier.padding(10.dp)){
                   Text("${mem.name} Personal", style=MaterialTheme.typography.titleSmall)
                   Text("Saved: ${mem.saved.toInt()} UGX")
                   Text("Loan: ${mem.loan.toInt()} UGX")
                   Text("Week ${weekNum}: $currentDate")
                 }}
                 Spacer(Modifier.height(6.dp))
                 Card(Modifier.fillMaxWidth(), colors=CardDefaults.cardColors(containerColor=MaterialTheme.colorScheme.secondaryContainer)){ Column(Modifier.padding(10.dp)){
                   Text("Group Combined", style=MaterialTheme.typography.titleSmall)
                   Text("Combined All: ${combinedSavings.toInt()} UGX")
                   Text("Box NOW: ${box.toInt()} UGX")
                   Text("Next Saving: $nextDate")
                 }}
                 Spacer(Modifier.height(6.dp))
                 Text("Transactions with Dates:", style=MaterialTheme.typography.titleSmall)
                 LazyColumn(Modifier.height(220.dp)){
                   if(memRecords.isEmpty()){ item{ Text("No records yet for ${mem.name}") } }
                   else { items(memRecords.reversed()){ r-> Card(Modifier.fillMaxWidth().padding(vertical=2.dp)){ Column(Modifier.padding(6.dp)){ Text("📅 ${r.date} (Week ${r.week})", style=MaterialTheme.typography.labelMedium); Text("${r.type} - ${r.amount.toInt()} UGX - Box:${r.boxAfter.toInt()}", style=MaterialTheme.typography.bodySmall) } } } }
                 }
               }
             },
             confirmButton={Button(onClick={selectedMember=null}){Text("Close")}})
           }
           Scaffold(topBar={TopAppBar(title={Text("Village V12 - Weekly")})}){pad->
            Column(Modifier.padding(pad).padding(10.dp)){
             Card(colors=CardDefaults.cardColors(containerColor=MaterialTheme.colorScheme.primaryContainer)){
              Column(Modifier.padding(10.dp)){
               Text("Week $weekNum: $currentDate", style=MaterialTheme.typography.titleMedium)
               Text("Next Saving: $nextDate ( +7 days )", style=MaterialTheme.typography.titleSmall)
               Text("Combined: ${combinedSavings.toInt()} | Box: ${box.toInt()} | Total: ${totalGroup.toInt()}", style=MaterialTheme.typography.bodySmall)
               Row(horizontalArrangement=Arrangement.spacedBy(6.dp), modifier=Modifier.padding(top=6.dp)){
                if(!isStarted){
                  Button(onClick={isStarted=true; isClosed=false}){Text("START ${currentDate}")}
                } else if(!isClosed){
                  Button(onClick={isClosed=true; currentDate=nextDate; nextDate=addDays(currentDate,7); weekNum++; isStarted=false; totalSavedToday=0.0}, colors=ButtonDefaults.buttonColors(containerColor=MaterialTheme.colorScheme.error)){Text("CLOSE -> $nextDate")}
                } else {
                  Button(onClick={isStarted=true; isClosed=false}){Text("START Week $weekNum")}
                }
                OutlinedButton(onClick={showClearDialog=true}){Text("Clear")}
               }
              }
             }
             TabRow(selectedTabIndex=tab){
              Tab(selected=tab==0, onClick={tab=0}, text={Text("Members")})
              Tab(selected=tab==1, onClick={tab=1}, text={Text("Social")})
              Tab(selected=tab==2, onClick={tab==2}, text={Text("All History")})
             }
             if(tab==0){
               Row(Modifier.padding(top=6.dp)){
                OutlinedTextField(value=newName, onValueChange={newName=it}, label={Text("Add member")}, modifier=Modifier.weight(1f))
                Button(onClick={if(newName.isNotBlank()){members=members+Member(nextId,newName); nextId++; newName=""}}, Modifier.padding(start=4.dp)){Text("Add #${nextId}")}
               }
               LazyColumn(Modifier.weight(1f).padding(top=4.dp)){
                items(members.sortedBy{it.id}){m->
                 val canLoan = m.saved >= MIN_SAVING && box >= LOAN_AMT && m.loan==0.0
                 Card(Modifier.fillMaxWidth().padding(vertical=3.dp).clickable{ selectedMember=m }){
                  Column(Modifier.padding(8.dp)){
                   Row(Modifier.fillMaxWidth(), horizontalArrangement=Arrangement.SpaceBetween){
                     Text("#${m.id} ${m.name} - S:${m.saved.toInt()}", style=MaterialTheme.typography.titleSmall)
                     Text("📅 $currentDate >", color=MaterialTheme.colorScheme.primary, style=MaterialTheme.typography.labelSmall)
                   }
                   Text(if(canLoan) "ELIGIBLE for loan!" else "Saved ${m.saved.toInt()} / 120k", style=MaterialTheme.typography.labelSmall)
                   if(isStarted &&!isClosed){
                    Row(Modifier.padding(top=4.dp), horizontalArrangement=Arrangement.spacedBy(3.dp)){
                     Button(onClick={ members=members.map{if(it.id==m.id) it.copy(saved=it.saved+FIXED) else it}; box+=FIXED; totalSavedToday+=FIXED; records=records+Record(currentDate,weekNum,m.id,m.name,"Save 5k",FIXED,box) }){Text("Save5k", style=MaterialTheme.typography.labelSmall)}
                     OutlinedTextField(value=feeAmount, onValueChange={feeAmount=it}, modifier=Modifier.width(55.dp), label={Text("Fee")})
                     Button(onClick={ val f=feeAmount.toDoubleOrNull()?:1000.0; members=members.map{if(it.id==m.id) it.copy(fee=it.fee+f) else it}; social+=f; records=records+Record(currentDate,weekNum,m.id,m.name,"Late",f,box) }){Text("Late", style=MaterialTheme.typography.labelSmall)}
                     Button(enabled=canLoan, onClick={ members=members.map{if(it.id==m.id) it.copy(loan=LOAN_AMT) else it}; box-=LOAN_AMT; records=records+Record(currentDate,weekNum,m.id,m.name,"Loan 150k",LOAN_AMT,box) }){Text("Loan", style=MaterialTheme.typography.labelSmall)}
                     Button(onClick={ if(m.loan>0){ members=members.map{if(it.id==m.id) it.copy(loan=0.0) else it}; box+=RETURN_AMT; records=records+Record(currentDate,weekNum,m.id,m.name,"Ret 165k",RETURN_AMT,box) } }){Text("Ret", style=MaterialTheme.typography.labelSmall)}
                    }
                   }
                  }
                 }
                }
               }
             } else if(tab==2){
               LazyColumn(Modifier.weight(1f).padding(top=6.dp)){
                 items(records.reversed()){ r->
                   Text("Week${r.week} 📅 ${r.date} | #${r.memberId} ${r.member} | ${r.type}", style=MaterialTheme.typography.bodySmall)
                   Text(" Amount:${r.amount.toInt()} Box:${r.boxAfter.toInt()}", style=MaterialTheme.typography.labelSmall, modifier=Modifier.padding(bottom=4.dp))
                 }
               }
             } else {
               LazyColumn(Modifier.weight(1f)){ item{ Text("Social: ${social.toInt()} UGX") } }
             }
            }
           }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
           <application android:label="Village V12" android:theme="@android:style/Theme.Material.Light">
            <activity android:name=".MainActivity" android:exported="true">
             <intent-filter>
              <action android:name="android.intent.action.MAIN"/>
              <category android:name="android.intent.category.LAUNCHER"/>
             </intent-filter>
            </activity>
           </application>
          </manifest>
          EOF
      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.5
      - name: Build APK
        run: |
          echo "android.useAndroidX=true" > gradle.properties
          echo "android.useAndroidX=true" > app/gradle.properties
          mkdir -p ~/.gradle
          echo "android.useAndroidX=true" > ~/.gradle/gradle.properties
          gradle :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Village-V12-APK
          path: app/build/outputs/apk/debug/app-debug.apk
