name: Build V9 APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Create V9
        run: |
          rm -rf app build.gradle settings.gradle gradle.properties
          mkdir -p app/src/main/java/com/zeu/v3
          echo "android.useAndroidX=true" > gradle.properties
          echo "include ':app'" > settings.gradle
          cat > build.gradle <<'EOF'
          buildscript {
            repositories { google(); mavenCentral() }
            dependencies {
              classpath 'com.android.tools.build:gradle:8.2.2'
              classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22'
            }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF
          cat > app/build.gradle <<'EOF'
          apply plugin: 'com.android.application'
          apply plugin: 'org.jetbrains.kotlin.android'
          android {
            namespace 'com.zeu.v3'
            compileSdk 34
            defaultConfig {
              applicationId "com.zeu.v3"
              minSdk 24; targetSdk 34
              versionCode 9; versionName "9.0"
            }
            buildTypes { release { minifyEnabled false } }
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
            kotlinOptions { jvmTarget = '17' }
            buildFeatures { compose true }
            composeOptions { kotlinCompilerExtensionVersion '1.5.10' }
          }
          dependencies {
            implementation 'androidx.core:core-ktx:1.12.0'
            implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
            implementation 'androidx.activity:activity-compose:1.8.2'
            implementation platform('androidx.compose:compose-bom:2024.02.00')
            implementation 'androidx.compose.ui:ui'
            implementation 'androidx.compose.material3:material3'
          }
          EOF
          cat > app/src/main/java/com/zeu/v3/MainActivity.kt <<'EOF'
          package com.zeu.v3
          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.unit.dp
          import java.text.SimpleDateFormat
          import java.util.*
          data class Member(val id: Int, var name: String, var saved: Double=0.0, var fee: Double=0.0, var loan: Double=0.0)
          data class Record(val date: String, val memberId: Int, val member: String, val type: String, val amount: Double, val boxAfter: Double)
          class MainActivity : ComponentActivity() {
           override fun onCreate(savedInstanceState: Bundle?) { super.onCreate(savedInstanceState); setContent { VillageV9() } }
          }
          @OptIn(ExperimentalMaterial3Api::class)
          @Composable
          fun VillageV9(){
           var nextId by remember { mutableStateOf(4) }
           var members by remember { mutableStateOf(listOf(Member(1,"James"), Member(2,"Mary"), Member(3,"Amina"))) }
           var records by remember { mutableStateOf(listOf<Record>()) }
           var newName by remember { mutableStateOf("") }
           var feeAmount by remember { mutableStateOf("1000") }
           var isStarted by remember { mutableStateOf(false) }
           var isClosed by remember { mutableStateOf(false) }
           var tab by remember { mutableStateOf(0) }
           var showClearDialog by remember { mutableStateOf(false) }
           var message by remember { mutableStateOf("") }
           val today = SimpleDateFormat("dd-MM-yyyy", Locale.getDefault()).format(Date())
           var box by remember { mutableStateOf(0.0) }
           var social by remember { mutableStateOf(0.0) }
           var totalSavedToday by remember { mutableStateOf(0.0) }
           val FIXED = 5000.0
           val LOAN_AMT = 150000.0
           val MIN_SAVING_TO_LOAN = 120000.0
           val INTEREST = 0.10
           val RETURN_AMT = LOAN_AMT + LOAN_AMT*INTEREST
           if(showClearDialog){
             AlertDialog(onDismissRequest={showClearDialog=false}, title={Text("Clear ALL?")}, text={Text("Delete all?")},
             confirmButton={Button(onClick={ members=emptyList(); records=emptyList(); box=0.0; social=0.0; totalSavedToday=0.0; isStarted=false; isClosed=false; nextId=1; showClearDialog=false; message="" }){Text("YES CLEAR")}},
             dismissButton={OutlinedButton(onClick={showClearDialog=false}){Text("Cancel")}})
           }
           Scaffold(topBar={TopAppBar(title={Text("Village V9 - $today")})}){pad->
            Column(Modifier.padding(pad).padding(10.dp)){
             Card(colors=CardDefaults.cardColors(containerColor=if(isClosed) MaterialTheme.colorScheme.errorContainer else MaterialTheme.colorScheme.primaryContainer)){
              Column(Modifier.padding(10.dp)){
               Text(if(isClosed) "CLOSED - Box: ${box.toInt()} LOCKED!" else if(isStarted) "WEEKLY: $today" else "Ready: $today - Weekly", style=MaterialTheme.typography.titleMedium)
               if(message.isNotBlank()){ Card(colors=CardDefaults.cardColors(containerColor=MaterialTheme.colorScheme.errorContainer)){ Text(message, modifier=Modifier.padding(6.dp), style=MaterialTheme.typography.bodySmall) } }
               Row(horizontalArrangement=Arrangement.spacedBy(6.dp), modifier=Modifier.padding(top=4.dp)){
                if(!isStarted){ Button(onClick={isStarted=true; isClosed=false; message="Week started!"}){Text("START WEEK")} }
                else if(!isClosed){ Button(onClick={isClosed=true; message="Week closed! Box: ${box.toInt()}"}, colors=ButtonDefaults.buttonColors(containerColor=MaterialTheme.colorScheme.error)){Text("CLOSE WEEK")} }
                else { Button(onClick={isStarted=false; isClosed=false; message=""}){Text("New Week")} }
                OutlinedButton(onClick={showClearDialog=true}){Text("Clear")}
               }
              }
             }
             Spacer(Modifier.height(6.dp))
             Card(Modifier.fillMaxWidth()){ Column(Modifier.padding(8.dp)){
               Text("Week Saved: ${totalSavedToday.toInt()} | Box NOW: ${box.toInt()} | Social: ${social.toInt()}", style=MaterialTheme.typography.titleSmall)
               Text("Rule: Need >=120k own savings to get 150k loan", style=MaterialTheme.typography.bodySmall)
             }}
             TabRow(selectedTabIndex=tab){
              Tab(selected=tab==0, onClick={tab=0}, text={Text("Members #")})
              Tab(selected=tab==1, onClick={tab==1}, text={Text("Social")})
              Tab(selected=tab==2, onClick={tab==2}, text={Text("History")})
             }
             if(tab==0){
               Row(Modifier.padding(top=6.dp)){
                OutlinedTextField(value=newName, onValueChange={newName=it}, label={Text("Add member")}, modifier=Modifier.weight(1f))
                Button(onClick={if(newName.isNotBlank()){members=members+Member(nextId,newName); nextId++; newName=""}}, Modifier.padding(start=4.dp)){Text("Add #${nextId}")}
               }
               LazyColumn(Modifier.weight(1f)){
                items(members.sortedBy{it.id}){m->
                 val canLoan = m.saved >= MIN_SAVING_TO_LOAN && box >= LOAN_AMT && m.loan==0.0
                 val reason = when {
                   m.loan>0 -> "Has loan ${m.loan.toInt()}"
                   m.saved < MIN_SAVING_TO_LOAN -> "Saved ${m.saved.toInt()} < 120k - NOT ELIGIBLE!"
                   box < LOAN_AMT -> "Box ${box.toInt()} < 150k - No group money!"
                   else -> "ELIGIBLE for 150k!"
                 }
                 Card(Modifier.fillMaxWidth().padding(vertical=3.dp), colors=CardDefaults.cardColors(containerColor=if(canLoan) MaterialTheme.colorScheme.secondaryContainer else MaterialTheme.colorScheme.surfaceVariant)){
                  Column(Modifier.padding(8.dp)){
                   Text("#${m.id} ${m.name} - Saved:${m.saved.toInt()} | Loan:${m.loan.toInt()}", style=MaterialTheme.typography.titleSmall)
                   Text(reason, style=MaterialTheme.typography.labelSmall, color=if(canLoan) MaterialTheme.colorScheme.primary else MaterialTheme.colorScheme.error)
                   if(isStarted &&!isClosed){
                    Row(Modifier.padding(top=4.dp), horizontalArrangement=Arrangement.spacedBy(3.dp)){
                     Button(onClick={ members=members.map{if(it.id==m.id) it.copy(saved=it.saved+FIXED) else it}; box+=FIXED; totalSavedToday+=FIXED; records=records+Record(today,m.id,m.name,"Save 5k",FIXED,box); message="" }){Text("Save5k", style=MaterialTheme.typography.labelSmall)}
                     OutlinedTextField(value=feeAmount, onValueChange={feeAmount=it}, modifier=Modifier.width(60.dp), label={Text("Fee")})
                     Button(onClick={ val f=feeAmount.toDoubleOrNull()?:1000.0; members=members.map{if(it.id==m.id) it.copy(fee=it.fee+f) else it}; social+=f; records=records+Record(today,m.id,m.name,"Late/Fee",f,box) }){Text("Late", style=MaterialTheme.typography.labelSmall)}
                     Button(enabled=canLoan, onClick={
                       if(m.saved < MIN_SAVING_TO_LOAN){ message="#${m.id} SAVED ONLY ${m.saved.toInt()}! Need 120k!" }
                       else if(box < LOAN_AMT){ message="Box ${box.toInt()} only! Need 150k!" }
                       else { members=members.map{if(it.id==m.id) it.copy(loan=LOAN_AMT) else it}; box-=LOAN_AMT; records=records+Record(today,m.id,m.name,"Loan 150k",LOAN_AMT,box); message="#${m.id} got 150k! Box left ${box.toInt()}" }
                     }){Text("Loan150k", style=MaterialTheme.typography.labelSmall)}
                     Button(onClick={ if(m.loan>=LOAN_AMT){ members=members.map{if(it.id==m.id) it.copy(loan=0.0) else it}; box+=RETURN_AMT; records=records+Record(today,m.id,m.name,"Return 165k",RETURN_AMT,box); message="Returned 165k Box ${box.toInt()}" } else { message="No loan!" } }){Text("Ret165k", style=MaterialTheme.typography.labelSmall)}
                    }
                   }
                  }
                 }
                }
               }
             } else if(tab==1){
               LazyColumn(Modifier.weight(1f).padding(top=6.dp)){
                item{ Card(colors=CardDefaults.cardColors(containerColor=MaterialTheme.colorScheme.tertiaryContainer), modifier=Modifier.fillMaxWidth()){ Column(Modifier.padding(12.dp)){ Text("SOCIAL FUND"); Text("${social.toInt()} UGX", style=MaterialTheme.typography.headlineMedium) } }; Spacer(Modifier.height(8.dp)) }
                items(records.filter{it.type.contains("Fee")}.reversed()){ r-> Card(Modifier.fillMaxWidth().padding(vertical=2.dp)){ Column(Modifier.padding(8.dp)){ Text("#${r.memberId} ${r.member} - ${r.amount.toInt()} UGX") }} }
               }
             } else {
               LazyColumn(Modifier.weight(1f).padding(top=6.dp)){
                item{ Text("History + Box After", style=MaterialTheme.typography.titleMedium) }
                items(records.reversed()){ r-> Text("#${r.memberId} ${r.member} | ${r.type} | Box:${r.boxAfter.toInt()} | ${r.date}", style=MaterialTheme.typography.bodySmall, modifier=Modifier.padding(vertical=2.dp)) }
               }
             }
            }
           }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
           <application android:label="Village V9" android:theme="@android:style/Theme.Material.Light">
            <activity android:name=".MainActivity" android:exported="true">
             <intent-filter>
              <action android:name="android.intent.action.MAIN"/>
              <category android:name="android.intent.category.LAUNCHER"/>
             </intent-filter>
            </activity>
           </application>
          </manifest>
          EOF
      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.5
      - name: Build APK
        run: |
          echo "android.useAndroidX=true" > gradle.properties
          echo "android.useAndroidX=true" > app/gradle.properties
          mkdir -p ~/.gradle
          echo "android.useAndroidX=true" > ~/.gradle/gradle.properties
          gradle :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Village-V9-APK
          path: app/build/outputs/apk/debug/app-debug.apk
