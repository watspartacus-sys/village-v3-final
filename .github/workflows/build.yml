name: Build V4 APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Create V4
        run: |
          rm -rf app build.gradle settings.gradle gradle.properties
          mkdir -p app/src/main/java/com/zeu/v3
          echo "android.useAndroidX=true" > gradle.properties
          echo "include ':app'" > settings.gradle
          cat > build.gradle <<'EOF'
          buildscript {
            repositories { google(); mavenCentral() }
            dependencies {
              classpath 'com.android.tools.build:gradle:8.2.2'
              classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22'
            }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF
          cat > app/build.gradle <<'EOF'
          apply plugin: 'com.android.application'
          apply plugin: 'org.jetbrains.kotlin.android'
          android {
            namespace 'com.zeu.v3'
            compileSdk 34
            defaultConfig {
              applicationId "com.zeu.v3"
              minSdk 24; targetSdk 34
              versionCode 4; versionName "4.0"
            }
            buildTypes { release { minifyEnabled false } }
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
            kotlinOptions { jvmTarget = '17' }
            buildFeatures { compose true }
            composeOptions { kotlinCompilerExtensionVersion '1.5.10' }
          }
          dependencies {
            implementation 'androidx.core:core-ktx:1.12.0'
            implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
            implementation 'androidx.activity:activity-compose:1.8.2'
            implementation platform('androidx.compose:compose-bom:2024.02.00')
            implementation 'androidx.compose.ui:ui'
            implementation 'androidx.compose.material3:material3'
          }
          EOF
          cat > app/src/main/java/com/zeu/v3/MainActivity.kt <<'EOF'
          package com.zeu.v3
          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.unit.dp
          import java.text.SimpleDateFormat
          import java.util.*
          data class Member(var name: String, var saved: Double=0.0, var fee: Double=0.0, var loan: Double=0.0)
          data class Record(val date: String, val member: String, val type: String, val amount: Double)
          class MainActivity : ComponentActivity() {
           override fun onCreate(savedInstanceState: Bundle?) { super.onCreate(savedInstanceState); setContent { VillageV4() } }
          }
          @OptIn(ExperimentalMaterial3Api::class)
          @Composable
          fun VillageV4(){
           var members by remember { mutableStateOf(listOf(Member("Amina"), Member("James"), Member("Sarah"))) }
           var records by remember { mutableStateOf(listOf<Record>()) }
           var newName by remember { mutableStateOf("") }
           var feeAmount by remember { mutableStateOf("1000") }
           var isStarted by remember { mutableStateOf(false) }
           var isClosed by remember { mutableStateOf(false) }
           var tab by remember { mutableStateOf(0) }
           val today = SimpleDateFormat("dd-MM-yyyy", Locale.getDefault()).format(Date())
           var box by remember { mutableStateOf(1250000.0) }
           var social by remember { mutableStateOf(320000.0) }
           val FIXED = 5000.0
           val LOAN_AMT = 150000.0
           val INTEREST = 0.10
           Scaffold(topBar={TopAppBar(title={Text("Village V4 - $today")})}){pad->
            Column(Modifier.padding(pad).padding(10.dp)){
             Card(colors=CardDefaults.cardColors(containerColor=if(isClosed) MaterialTheme.colorScheme.errorContainer else MaterialTheme.colorScheme.primaryContainer)){
              Column(Modifier.padding(10.dp)){
               Text(if(isClosed) "CLOSED - $today - LOCKED!" else if(isStarted) "Meeting: $today" else "Ready: $today", style=MaterialTheme.typography.titleMedium)
               Row(horizontalArrangement=Arrangement.spacedBy(6.dp)){
                if(!isStarted){ Button(onClick={isStarted=true; isClosed=false}){Text("START")} }
                else if(!isClosed){ Button(onClick={isClosed=true}, colors=ButtonDefaults.buttonColors(containerColor=MaterialTheme.colorScheme.error)){Text("CLOSE")} }
                else { Button(onClick={isStarted=false; isClosed=false}){Text("New Day")} }
                OutlinedButton(onClick={ members=listOf(Member("Amina"), Member("James"), Member("Sarah")); records=listOf(); box=1250000.0; social=320000.0; isStarted=false; isClosed=false }){Text("Clear Data")}
               }
              }
             }
             Spacer(Modifier.height(6.dp))
             Card(Modifier.fillMaxWidth()){ Column(Modifier.padding(8.dp)){
               Text("Box: ${box.toInt()} UGX | Social Fund: ${social.toInt()} UGX", style=MaterialTheme.typography.titleMedium)
               Text("Total Members: ${members.size} | Total Saved: ${members.sumOf{it.saved}.toInt()} UGX", style=MaterialTheme.typography.bodySmall)
             }}
             TabRow(selectedTabIndex=tab){
              Tab(selected=tab==0, onClick={tab=0}, text={Text("Members")})
              Tab(selected=tab==1, onClick={tab=1}, text={Text("Social Fund")})
              Tab(selected=tab==2, onClick={tab=2}, text={Text("History")})
             }
             if(tab==0){
               Row(Modifier.padding(top=6.dp)){
                OutlinedTextField(value=newName, onValueChange={newName=it}, label={Text("Add member")}, modifier=Modifier.weight(1f))
                Button(onClick={if(newName.isNotBlank()){members=members+Member(newName); newName=""}}, Modifier.padding(start=4.dp)){Text("Add")}
               }
               LazyColumn(Modifier.weight(1f)){
                items(members){m->
                 Card(Modifier.fillMaxWidth().padding(vertical=3.dp)){
                  Column(Modifier.padding(8.dp)){
                   Text("${m.name} - Saved:${m.saved.toInt()} Fee:${m.fee.toInt()} Loan:${m.loan.toInt()}", style=MaterialTheme.typography.titleSmall)
                   if(isStarted &&!isClosed){
                    Row(Modifier.padding(top=4.dp), horizontalArrangement=Arrangement.spacedBy(4.dp)){
                     Button(onClick={ members=members.map{if(it.name==m.name) it.copy(saved=it.saved+FIXED) else it}; box+=FIXED; records=records+Record(today,m.name,"Pay 5k",FIXED) }){Text("Pay5k", style=MaterialTheme.typography.labelSmall)}
                     OutlinedTextField(value=feeAmount, onValueChange={feeAmount=it}, modifier=Modifier.width(70.dp), label={Text("Fee")})
                     Button(onClick={ val f=feeAmount.toDoubleOrNull()?:1000.0; members=members.map{if(it.name==m.name) it.copy(fee=it.fee+f) else it}; social+=f; records=records+Record(today,m.name,"Late/Fee",f) }){Text("Late", style=MaterialTheme.typography.labelSmall)}
                     Button(onClick={ members=members.map{if(it.name==m.name) it.copy(loan=LOAN_AMT) else it}; box-=LOAN_AMT; records=records+Record(today,m.name,"Loan 150k",LOAN_AMT) }){Text("150k", style=MaterialTheme.typography.labelSmall)}
                     Button(onClick={ val ret=LOAN_AMT+LOAN_AMT*INTEREST; members=members.map{if(it.name==m.name) it.copy(loan=0.0) else it}; box+=ret; records=records+Record(today,m.name,"Return",ret) }){Text("Ret", style=MaterialTheme.typography.labelSmall)}
                    }
                   } else { Text("Start meeting to transact", style=MaterialTheme.typography.labelSmall) }
                  }
                 }
                }
               }
             } else if(tab==1){
               LazyColumn(Modifier.weight(1f).padding(top=6.dp)){
                item{
                  Card(colors=CardDefaults.cardColors(containerColor=MaterialTheme.colorScheme.tertiaryContainer), modifier=Modifier.fillMaxWidth()){
                    Column(Modifier.padding(12.dp)){
                      Text("SOCIAL FUND TOTAL", style=MaterialTheme.typography.labelMedium)
                      Text("${social.toInt()} UGX", style=MaterialTheme.typography.headlineMedium)
                      Text("All Late + Fees go here", style=MaterialTheme.typography.bodySmall)
                    }
                  }
                  Spacer(Modifier.height(8.dp))
                  Text("Social Fund Records:", style=MaterialTheme.typography.titleSmall)
                }
                val socialRecords = records.filter{ it.type=="Late/Fee" }
                if(socialRecords.isEmpty()){ item{ Text("No fees yet. When you charge Late fee, it shows here!", Modifier.padding(8.dp)) } }
                items(socialRecords.reversed()){ r->
                  Card(Modifier.fillMaxWidth().padding(vertical=2.dp)){ Column(Modifier.padding(8.dp)){
                    Text("${r.date} - ${r.member} paid ${r.amount.toInt()} UGX", style=MaterialTheme.typography.bodyMedium)
                    Text("Type: ${r.type}", style=MaterialTheme.typography.labelSmall)
                  }}
                }
               }
             } else {
               LazyColumn(Modifier.weight(1f).padding(top=6.dp)){
                item{ Text("History by Date - ${today}", style=MaterialTheme.typography.titleMedium) }
                items(records.reversed()){ r-> Text("${r.date} | ${r.member} | ${r.type} | ${r.amount.toInt()} UGX", style=MaterialTheme.typography.bodySmall, modifier=Modifier.padding(vertical=2.dp)) }
                if(records.isEmpty()){ item{ Text("No records yet", Modifier.padding(8.dp)) } }
               }
             }
            }
           }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
           <application android:label="Village V4" android:theme="@android:style/Theme.Material.Light">
            <activity android:name=".MainActivity" android:exported="true">
             <intent-filter>
              <action android:name="android.intent.action.MAIN"/>
              <category android:name="android.intent.category.LAUNCHER"/>
             </intent-filter>
            </activity>
           </application>
          </manifest>
          EOF
      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.5
      - name: Build APK
        run: |
          echo "android.useAndroidX=true" > gradle.properties
          echo "android.useAndroidX=true" > app/gradle.properties
          mkdir -p ~/.gradle
          echo "android.useAndroidX=true" > ~/.gradle/gradle.properties
          gradle :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Village-V4-APK
          path: app/build/outputs/apk/debug/app-debug.apk
