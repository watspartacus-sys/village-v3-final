name: Build V3 APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create Fresh Project
        run: |
          rm -rf app build.gradle settings.gradle
          mkdir -p app/src/main/java/com/zeu/v3

          cat > settings.gradle <<'EOF'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          buildscript {
            repositories { google(); mavenCentral() }
            dependencies {
              classpath 'com.android.tools.build:gradle:8.2.2'
              classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22'
            }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF

          cat > app/build.gradle <<'EOF'
          apply plugin: 'com.android.application'
          apply plugin: 'org.jetbrains.kotlin.android'
          android {
            namespace 'com.zeu.v3'
            compileSdk 34
            defaultConfig {
              applicationId "com.zeu.v3"
              minSdk 24; targetSdk 34
              versionCode 3; versionName "3.0"
            }
            buildTypes { release { minifyEnabled false } }
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
            kotlinOptions { jvmTarget = '17' }
            buildFeatures { compose true }
            composeOptions { kotlinCompilerExtensionVersion '1.5.10' }
          }
          dependencies {
            implementation 'androidx.core:core-ktx:1.12.0'
            implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
            implementation 'androidx.activity:activity-compose:1.8.2'
            implementation platform('androidx.compose:compose-bom:2024.02.00')
            implementation 'androidx.compose.ui:ui'
            implementation 'androidx.compose.material3:material3'
          }
          EOF

          cat > app/src/main/java/com/zeu/v3/MainActivity.kt <<'EOF'
          package com.zeu.v3
          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.unit.dp
          import java.text.SimpleDateFormat
          import java.util.*
          data class Member(var name: String, var saved: Double=0.0, var fee: Double=0.0, var loan: Double=0.0)
          data class Record(val date: String, val member: String, val type: String, val amount: Double)
          class MainActivity : ComponentActivity() {
           override fun onCreate(savedInstanceState: Bundle?) {
            super.onCreate(savedInstanceState)
            setContent { VillageV3() }
           }
          }
          @OptIn(ExperimentalMaterial3Api::class)
          @Composable
          fun VillageV3(){
           var members by remember { mutableStateOf(listOf(Member("Amina"), Member("James"), Member("Sarah"))) }
           var records by remember { mutableStateOf(listOf<Record>()) }
           var newName by remember { mutableStateOf("") }
           var feeAmount by remember { mutableStateOf("1000") }
           var isStarted by remember { mutableStateOf(false) }
           var isClosed by remember { mutableStateOf(false) }
           val today = SimpleDateFormat("dd-MM-yyyy", Locale.getDefault()).format(Date())
           var box by remember { mutableStateOf(1250000.0) }
           var social by remember { mutableStateOf(320000.0) }
           val FIXED = 5000.0
           val LOAN_AMT = 150000.0
           val INTEREST = 0.10
           Scaffold(topBar={TopAppBar(title={Text("Village Savings V3 - $today")})}){pad->
            Column(Modifier.padding(pad).padding(12.dp)){
             Card(colors=CardDefaults.cardColors(containerColor=if(isClosed) MaterialTheme.colorScheme.errorContainer else MaterialTheme.colorScheme.primaryContainer)){
              Column(Modifier.padding(12.dp)){
               Text(if(isClosed) "Meeting Closed - $today - LOCKED!" else if(isStarted) "Meeting Started - $today" else "Ready to Start", style=MaterialTheme.typography.titleMedium)
               Spacer(Modifier.height(8.dp))
               Row{
                if(!isStarted){ Button(onClick={isStarted=true; isClosed=false}){Text("START MEETING")} }
                else if(!isClosed){ Button(onClick={isClosed=true}, colors=ButtonDefaults.buttonColors(containerColor=MaterialTheme.colorScheme.error)){Text("CLOSE MEETING")} }
                else { Button(onClick={isStarted=false; isClosed=false}){Text("New Day")} }
               }
              }
             }
             Spacer(Modifier.height(8.dp))
             Text("Box: ${box.toInt()} UGX | Social: ${social.toInt()} UGX", style=MaterialTheme.typography.titleSmall)
             Row{
              OutlinedTextField(value=newName, onValueChange={newName=it}, label={Text("Add member")}, modifier=Modifier.weight(1f))
              Button(onClick={if(newName.isNotBlank()){members=members+Member(newName); newName=""}}, Modifier.padding(start=4.dp)){Text("Add")}
             }
             LazyColumn(Modifier.weight(1f)){
              items(members){m->
               Card(Modifier.fillMaxWidth().padding(vertical=4.dp)){
                Column(Modifier.padding(8.dp)){
                 Text("${m.name} - Saved:${m.saved.toInt()} Fee:${m.fee.toInt()} Loan:${m.loan.toInt()}", style=MaterialTheme.typography.titleSmall)
                 if(isStarted &&!isClosed){
                  Row(Modifier.padding(top=4.dp), horizontalArrangement=Arrangement.spacedBy(4.dp)){
                   Button(onClick={
                    members=members.map{if(it.name==m.name) it.copy(saved=it.saved+FIXED) else it}
                    box+=FIXED; records=records+Record(today,m.name,"Pay 5k",FIXED)
                   }){Text("Pay 5k", style=MaterialTheme.typography.labelSmall)}
                   OutlinedTextField(value=feeAmount, onValueChange={feeAmount=it}, modifier=Modifier.width(80.dp), label={Text("Fee")})
                   Button(onClick={
                    val f=feeAmount.toDoubleOrNull()?:1000.0
                    members=members.map{if(it.name==m.name) it.copy(fee=it.fee+f) else it}
                    social+=f; records=records+Record(today,m.name,"Late/Fee",f)
                   }){Text("Late", style=MaterialTheme.typography.labelSmall)}
                   Button(onClick={
                    members=members.map{if(it.name==m.name) it.copy(loan=LOAN_AMT) else it}
                    box-=LOAN_AMT; records=records+Record(today,m.name,"Loan 150k",LOAN_AMT)
                   }){Text("150k", style=MaterialTheme.typography.labelSmall)}
                   Button(onClick={
                    val ret=LOAN_AMT+LOAN_AMT*INTEREST
                    members=members.map{if(it.name==m.name) it.copy(loan=0.0) else it}
                    box+=ret; records=records+Record(today,m.name,"Return",ret)
                   }){Text("Return", style=MaterialTheme.typography.labelSmall)}
                  }
                 } else { Text("Start meeting to transact", style=MaterialTheme.typography.labelSmall) }
                }
               }
              }
              item{
               Divider(Modifier.padding(vertical=8.dp))
               Text("History by Date", style=MaterialTheme.typography.titleMedium)
               records.reversed().forEach{
                Text("${it.date} - ${it.member} - ${it.type} - ${it.amount.toInt()} UGX", style=MaterialTheme.typography.bodySmall)
               }
              }
             }
            }
           }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
           <application android:label="Village V3" android:theme="@android:style/Theme.Material.Light">
            <activity android:name=".MainActivity" android:exported="true">
             <intent-filter>
              <action android:name="android.intent.action.MAIN"/>
              <category android:name="android.intent.category.LAUNCHER"/>
             </intent-filter>
            </activity>
           </application>
          </manifest>
          EOF
          ls -R

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.5

      - name: Build APK
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Village-V3-APK
          path: app/build/outputs/apk/debug/app-debug.apk